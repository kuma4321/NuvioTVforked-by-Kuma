name: Build APK Nuvio TV Fluide

on:
  workflow_dispatch:
  push:
    branches: [fluide]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configuration officielle (compte, TMDB, Trakt)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          bash ci/extract-official-config.sh "$RUNNER_TEMP/official.env"
          cp "$RUNNER_TEMP/official.env" local.properties
          cp "$RUNNER_TEMP/official.env" local.dev.properties
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        shell: bash
        env:
          KS: ${{ secrets.FLUIDE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/fluide.jks"; else cp ci/fluide-signing.jks "$RUNNER_TEMP/fluide.jks"; fi
          { echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/fluide.jks"; echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"; echo "NUVIO_RELEASE_KEY_PASSWORD=android"; echo "NUVIO_RELEASE_STORE_PASSWORD=android"; } >> "$GITHUB_ENV"
      - name: Compilation de l'APK (fullDebug)
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleFullDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -E "^e: " build.log | head -8; grep -A6 "What went wrong" build.log | tr '\n' ' ' | cut -c1-900; } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $status
      - uses: actions/upload-artifact@v7
        with:
          name: Nuvio-TV-Fluide-APK-armeabi-v7a
          path: app/build/outputs/apk/full/debug/*armeabi-v7a*.apk
          if-no-files-found: error
